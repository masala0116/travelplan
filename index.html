<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FAF8F5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>🗾 JAPAN TRIP 2026</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-top-label">FAMILY TRIP</div>
                <div class="header-main">
                    <h1 class="logo-text">東京旅行</h1>
                    <span class="year-badge">2026</span>
                </div>
            </div>
        </header>

        <!-- Tab Navigation -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="itinerary">📅 行程</button>
            <button class="tab-btn" data-tab="info">ℹ️ 資訊</button>
            <button class="tab-btn" data-tab="budget">💰 記帳</button>
            <button class="tab-btn" data-tab="guide">📖 攻略</button>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- ==================== Itinerary Tab ==================== -->
            <section id="itineraryTab" class="tab-content active">
                <!-- Day Selector -->
                <div class="day-selector">
                    <div class="day-chips" id="dayChips">
                        <!-- Generated by JS -->
                    </div>
                </div>

                <!-- Day Indicator + Hero Card -->
                <div class="day-hero-container">
                    <div class="day-indicator">
                        <span class="day-num" id="dayIndicatorNum">第一天</span>
                    </div>
                    <div class="hero-card" id="heroCard">
                        <img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=800&q=80" alt="Tokyo" class="hero-image">
                        <div class="hero-overlay">
                            <div class="hero-day-badge">DAY 1 📍 東京</div>
                            <h2 class="hero-title">東京輕井澤之旅</h2>
                        </div>
                    </div>
                </div>

                <!-- Weather Card -->
                <div id="weatherCard">
                    <div class="weather-card">
                        <div class="weather-header">
                            <span class="weather-location">載入天氣中...</span>
                        </div>
                    </div>
                </div>

                <!-- Day Header -->
                <h2 class="day-title" id="dayTitle">Day 1 · 1月22日 (四)</h2>
                <p class="day-subtitle" id="daySubtitle">抵達東京</p>

                <!-- Timeline -->
                <div class="timeline" id="timeline">
                    <!-- Generated by JS -->
                </div>
            </section>

            <!-- ==================== Info Tab ==================== -->
            <section id="infoTab" class="tab-content">
                <!-- Flight Info -->
                <div class="info-section">
                    <h2 class="section-title">✈️ 航班資訊</h2>
                    <div id="flightInfo">
                        <!-- Generated by JS -->
                    </div>
                </div>

                <!-- Hotel Info -->
                <div class="info-section">
                    <h2 class="section-title">🏨 住宿資訊</h2>
                    <div id="hotelInfo">
                        <!-- Generated by JS -->
                    </div>
                </div>

                <!-- Emergency Contacts -->
                <div class="info-section">
                    <h2 class="section-title">🆘 緊急聯絡電話</h2>
                    <div id="emergencyInfo">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </section>

            <!-- ==================== Budget Tab ==================== -->
            <section id="budgetTab" class="tab-content">
                <!-- Budget Overview -->
                <div class="budget-overview" id="budgetOverview">
                    <!-- Generated by JS -->
                </div>

                <!-- Calculator -->
                <div class="calculator">
                    <div class="calc-display">
                        <div class="calc-amount" id="calcAmount">¥ 0</div>
                        <div class="calc-converted" id="calcConverted">≈ NT$ 0</div>
                    </div>
                    <div class="calc-grid">
                        <button class="calc-btn" data-value="7">7</button>
                        <button class="calc-btn" data-value="8">8</button>
                        <button class="calc-btn" data-value="9">9</button>
                        <button class="calc-btn clear" data-value="C">C</button>
                        <button class="calc-btn" data-value="4">4</button>
                        <button class="calc-btn" data-value="5">5</button>
                        <button class="calc-btn" data-value="6">6</button>
                        <button class="calc-btn" data-value="DEL">⌫</button>
                        <button class="calc-btn" data-value="1">1</button>
                        <button class="calc-btn" data-value="2">2</button>
                        <button class="calc-btn" data-value="3">3</button>
                        <button class="calc-btn action" id="addExpenseBtn" rowspan="2">記帳</button>
                        <button class="calc-btn" data-value="0">0</button>
                        <button class="calc-btn wide" data-value="00">00</button>
                    </div>
                </div>

                <!-- Category Selector -->
                <div class="category-selector">
                    <button class="category-btn active" data-category="food">🍜 餐飲</button>
                    <button class="category-btn" data-category="transport">🚃 交通</button>
                    <button class="category-btn" data-category="ticket">🎫 門票</button>
                    <button class="category-btn" data-category="shopping">🛒 購物</button>
                    <button class="category-btn" data-category="other">📦 其他</button>
                </div>

                <!-- Expense List -->
                <div class="section-title mt-lg">📊 消費紀錄</div>
                <div id="expenseList">
                    <!-- Generated by JS -->
                </div>
            </section>

            <!-- ==================== Guide Tab ==================== -->
            <section id="guideTab" class="tab-content">
                <h2 class="section-title">📖 景點攻略</h2>
                <p class="day-subtitle mb-lg">精選景點故事與美食推薦</p>
                <div id="guideList">
                    <!-- Generated by JS -->
                </div>
            </section>

        </main>

        <!-- ==================== Settings Modal ==================== -->
        <div class="modal-overlay" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 class="modal-title">⚙️ 設定</h3>
                    <button class="modal-close">✕</button>
                </div>
                
                <div class="settings-section">
                    <label class="settings-label">匯率 (¥1 = NT$)</label>
                    <input type="number" id="exchangeRateInput" class="settings-input" step="0.001" value="0.215">
                </div>
                
                <div class="settings-section">
                    <label class="settings-label">預算總額 (¥)</label>
                    <input type="number" id="budgetInput" class="settings-input" value="200000">
                </div>
                
                <button class="nav-button" id="saveSettingsBtn" style="width: 100%; justify-content: center; margin-top: 16px;">
                    💾 儲存設定
                </button>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
